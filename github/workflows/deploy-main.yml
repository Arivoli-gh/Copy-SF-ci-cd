name: Deploy - Main
on:
  push:
    branches: [main]
  workflow_dispatch:
 
concurrency:
  group: deploy-prod
  cancel-in-progress: false
 
env:
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
  SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
  SNOWFLAKE_PRIVATE_KEY_FILE: /tmp/rsa_key.p8
  PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PASSPHRASE }}
 
jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install snowflake-cli
      - name: Write private key (Option B; omit when using OIDC)
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8 && chmod 600 /tmp/rsa_key.p8
      - name: Fetch main and deploy the same code to DEMO_PROD
        run: |
          snow sql -q "ALTER GIT REPOSITORY CICD_DB.GIT.CICD_REPO FETCH"
          snow sql -q "EXECUTE IMMEDIATE FROM @CICD_DB.GIT.CICD_REPO/branches/main/deploy_all.sql USING (db_name => 'DEMO_PROD', commit_sha => '${{ github.sha }}')"
