name: test
on:
  push:
    branches: [main]
  workflow_dispatch:
  
jobs:
  validate-dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PASSPHRASE }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: 1. Verify GitHub Variables & Secrets are loaded
        run: |
          echo "Account length: ${#SNOWFLAKE_ACCOUNT}"
          echo "User length: ${#SNOWFLAKE_USER}"
          echo "Private Key length: ${#SNOWFLAKE_PRIVATE_KEY}"
          echo "Passphrase length: ${#SNOWFLAKE_PASSPHRASE}"
        env:
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PASSPHRASE: ${{ secrets.SNOWFLAKE_PASSPHRASE }}

      - name: 2. Write & Validate Private Key Format
        run: |
          printf "%s\n" "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8
          head -n 1 /tmp/rsa_key.p8
          tail -n 1 /tmp/rsa_key.p8
          openssl rsa -in /tmp/rsa_key.p8 -passin env:PRIVATE_KEY_PASSPHRASE -noout && echo "Key & Passphrase VALID!"

      - name: 3. Create Snowflake Config & Test Connectivity
        run: |
          mkdir -p ~/.snowflake
          printf 'default_connection_name = "default"\n\n[connections.default]\naccount = "%s"\nuser = "%s"\nauthenticator = "SNOWFLAKE_JWT"\nprivate_key_file = "/tmp/rsa_key.p8"\n' \
            "${{ vars.SNOWFLAKE_ACCOUNT }}" \
            "${{ vars.SNOWFLAKE_USER }}" > ~/.snowflake/config.toml
          chmod 600 ~/.snowflake/config.toml

          snow connection test
          snow sql -q "SELECT CURRENT_USER(), CURRENT_ROLE(), CURRENT_ACCOUNT(), CURRENT_VERSION();"
