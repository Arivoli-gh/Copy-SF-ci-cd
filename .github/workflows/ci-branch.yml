name: CI - Branch

on:
  push:
    branches-ignore: [main]

concurrency:
  group: deploy-dev           # one DEV deployment at a time
  cancel-in-progress: false

env:
  TARGET_DB: DEMO_DEV
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
  PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PASSPHRASE }}

jobs:
  validate-dev:                   # required status check on main
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install tools
        run: pip install snowflake-cli schemachange==3.7.0

      - name: Write private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printf "%s\n" "$SNOWFLAKE_PRIVATE_KEY" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8
          openssl rsa -in /tmp/rsa_key.p8 -passin env:PRIVATE_KEY_PASSPHRASE -noout \
            && echo "Key & Passphrase VALID!"

      - name: Create Snowflake configs
        run: |
          # Config for Snowflake CLI (snow)
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml <<EOF
          default_connection_name = "default"

          [connections.default]
          account = "$SNOWFLAKE_ACCOUNT"
          user = "$SNOWFLAKE_USER"
          authenticator = "SNOWFLAKE_JWT"
          private_key_file = "/tmp/rsa_key.p8"
          private_key_file_pwd = "$PRIVATE_KEY_PASSPHRASE"
          EOF
          chmod 600 ~/.snowflake/config.toml

          # Config for schemachange
          cat > /tmp/connections.toml <<EOF
          [dev]
          account = "$SNOWFLAKE_ACCOUNT"
          user = "$SNOWFLAKE_USER"
          authenticator = "SNOWFLAKE_JWT"
          private_key_file = "/tmp/rsa_key.p8"
          private_key_file_pwd = "$PRIVATE_KEY_PASSPHRASE"
          EOF
          chmod 600 /tmp/connections.toml

      - name: Ensure target database and schema exist
        run: |
          snow sql -q "CREATE DATABASE IF NOT EXISTS $TARGET_DB"
          snow sql -q "CREATE SCHEMA IF NOT EXISTS $TARGET_DB.SCHEMACHANGE"

      - name: Run schemachange on all folders (DEMO_DEV)
        run: |
          echo "==================== START DEPLOYMENT ================="
          echo "Processing repo: $(basename "$GITHUB_WORKSPACE") ..."
          schemachange deploy \
            -f "$GITHUB_WORKSPACE" \
            --connections-file-path /tmp/connections.toml \
            --connection-name dev \
            -c "$TARGET_DB.SCHEMACHANGE.CHANGE_HISTORY" \
            --create-change-history-table \
            --vars "{\"DATABASE\": \"$TARGET_DB\", \"COMMIT_SHA\": \"${{ github.sha }}\"}"

      - name: Run smoke tests in DEMO_DEV
        run: snow sql -f tests/smoke_tests.sql -D db_name=$TARGET_DB

      - name: Clean up secrets
        if: always()
        run: rm -f /tmp/rsa_key.p8 /tmp/connections.toml ~/.snowflake/config.toml

  open-pr-and-automerge:
    needs: validate-dev
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open PR if none exists, then enable auto-merge
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ -z "$(gh pr list --head "$BRANCH" --base main --json number -q '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Deploy: $BRANCH" \
              --body "Auto-created after DEV deploy and tests passed (commit ${{ github.sha }})."
          fi
          gh pr merge "$BRANCH" --auto --squash
