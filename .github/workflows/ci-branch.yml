name: CI - Branch

on:
  push:
    branches-ignore: [main]

concurrency:
  group: deploy-dev           # one DEV deployment at a time
  cancel-in-progress: false

env:
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
  SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
  SNOWFLAKE_PRIVATE_KEY_FILE: /tmp/rsa_key.p8
  PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PASSPHRASE }}

jobs:
  validate-dev:                   # required status check on main
    runs-on: ubuntu-latest        # GitHub-hosted cloud runner
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installing required packages
        run: |
          pip install snowflake
          pip install snowflake-connector-python
          pip install schemachange
          pip install tomli

      - name: Write private key
        run: |
          printf "%s\n" "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8
          openssl rsa -in /tmp/rsa_key.p8 -passin env:PRIVATE_KEY_PASSPHRASE -noout && echo "Key & Passphrase VALID!"

      - name: Create connections.toml
        run: |
          mkdir -p ./config
          echo "[snowflake]" > ./config/connections.toml
          echo "account = \"${{ vars.SNOWFLAKE_ACCOUNT }}\"" >> ./config/connections.toml
          echo "user = \"${{ vars.SNOWFLAKE_USER }}\"" >> ./config/connections.toml
          echo "database = \"DEMO_DEV\"" >> ./config/connections.toml
          echo "private_key_file = \"/tmp/rsa_key.p8\"" >> ./config/connections.toml
          echo "private_key_file_pwd = \"${{ secrets.SNOWFLAKE_PASSPHRASE }}\"" >> ./config/connections.toml
          echo "authenticator = \"snowflake_jwt\"" >> ./config/connections.toml
          chmod 600 ./config/connections.toml

      - name: Run schemachange on all folders (DEMO_DEV)
        run: |
          echo "==================== START DEPLOYMENT ================="
          echo "Processing folder $(basename "$GITHUB_WORKSPACE") ..."
          schemachange -f $GITHUB_WORKSPACE \
                        --connections-file-path ./config/connections.toml \
                        --connection-name snowflake -c DEMO_DEV.SCHEMACHANGE.CHANGE_HISTORY --create-change-history-table \
                        --vars '{"DATABASE": "DEMO_DEV", "COMMIT_SHA": "${{ github.sha }}"}'

      - name: Clean up private key
        if: always()
        run: rm -f /tmp/rsa_key.p8

  open-pr-and-automerge:
    needs: validate-dev
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open PR if none exists, then enable auto-merge
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ -z "$(gh pr list --head "$BRANCH" --base main --json number -q '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Deploy: $BRANCH" \
              --body "Auto-created after DEV deploy passed (commit ${{ github.sha }})."
          fi
          for i in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --auto --squash; then
              echo "Auto-merge enabled."
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Could not enable auto-merge after 5 attempts."
          exit 1
